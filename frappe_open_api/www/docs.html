{% extends "templates/web.html" %}

{% block page_content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.27.1/swagger-ui.min.css"
    integrity="sha512-FCw+cnh2A20omSXcIdoLnqQrVbcPiyAPEjKlSZdj6uIR++Xx0VIduMmFZhzYm/gf7bqmZ7dzP3+WVn2Gfr5TjQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.27.1/swagger-ui-bundle.min.js"
    integrity="sha512-5wwTumuGSEhs2cxv8qTPioOYR5ApZvDzEi8iEJ7ENTOzQ9/qLYh9tWKkMFlrYLpEcnHK+TkqvOLJxKSDGOWrfQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.27.1/swagger-ui-standalone-preset.min.js"
    integrity="sha512-yJlD9FXQ7YaxAKXhviHSt/0KqWDCkLFdCnk0Ti23HXDMEQtHLAAWMHZ+POglC1mx/MOUB//h8kci3U1JYrywpQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
    body,
    .page-body.full-width {
        background: #f8f9fa;
        width: 100%;
        max-width: 100vw;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }

    .navbar {
        margin-bottom: 0;
    }

    .card {
        border-radius: 1rem;
    }

    #swagger-ui {
        min-height: 70vh;
        background: #fff;
    }

    @media (max-width: 768px) {
        .navbar .form-select {
            max-width: 100%;
        }
    }
</style>

<!-- Top Navbar for App Selector -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4" style="border-radius: 1rem;">
    <div class="container-fluid">
        <!-- <span class="navbar-brand fw-bold fs-3"
            style="font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; color: #5e64ff;">
            API Explorer <span class="fw-normal" style="color: #222;">- Swagger UI</span>
        </span> -->
        <h3>Frappe Open API</h3>
        <form class="d-flex ms-auto align-items-center">
            <select id="app-select" class="form-select" style="max-width: 300px;">
                {% for app in apps %}
                <option value="{{ app }}" {% if app==default_app %}selected{% endif %}>{{ app_titles[app] }}</option>
                {% endfor %}
            </select>
        </form>
    </div>
</nav>

<!-- Main Content -->
<div class="page-body full-width">
    <div class="card shadow-sm mb-4" style="border-radius: 1rem;">
        <div class="card-body">
            <div id="swagger-ui"></div>
        </div>
    </div>
</div>


<script>
    const apps = [
        {% for app in apps %}
    "{{ app }}"{% if not loop.last %}, {% endif %}
    {% endfor %}
    ];
    const defaultApp = "{{ default_app }}";
    let currentTheme = "agate"; // default theme

    function loadSwagger(appName) {
        const url = `/files/openapi/openapi_${appName}.json`;
        document.getElementById('swagger-ui').innerHTML = '';
        SwaggerUIBundle({
            url: url,
            dom_id: '#swagger-ui',
            deepLinking: true,
            filter: true,
            displayRequestDuration: true,
            syntaxHighlight: {
                activated: true,
                theme: currentTheme
            },
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "BaseLayout",
            requestInterceptor: (request) => {
                request.headers["X-Frappe-CSRF-Token"] = null;
                return request;
            },
            docExpansion: "none",
            persistAuthorization: true,
        });
    }

    if (apps.length) {
        loadSwagger(defaultApp);
    }

    document.getElementById('app-select').addEventListener('change', function () {
        loadSwagger(this.value);
    });
</script>
{% endblock %}
